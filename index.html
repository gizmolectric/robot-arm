<!DOCTYPE html>
<html>
<head>
    <title>Arm Control Panel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        .slider-container {
            margin: 20px auto;
            width: 800px;
            max-width: 90%;
            background: #222;
            padding-top: 2px;
            padding-bottom: 8px;
            padding-left: 20px;
            padding-right: 20px;
            border-radius: 12px;
        }

        input[type=range] {
            width: 100%;
            height: 30px;
        }

        h2 {
            margin-bottom: 1px;
        }

        @media (max-width: 600px) {
            .slider-container {
                width: 100%;
                padding: 18px;
            }
            input[type=range] {
                height: 35px;
            }
        }
    </style>
</head>
<body>

    <h1>Mechanical Arm Controller</h1>

    <div class="slider-container">
        <h2>[CCW] Base [CW]</h2>
        <input type="range" min="0" max="180" value="90"
            oninput="updateServo(0, this.value)">
    </div>

    <div class="slider-container">
        <h2>[Down] Shoulder [Up]</h2>
        <input type="range" min="0" max="180" value="90"
            oninput="updateServo(3, this.value)">
    </div>

    <div class="slider-container">
        <h2>[Down] Elbow [Up]</h2>
        <input type="range" min="0" max="180" value="90"
            oninput="updateServo(4, 180 - this.value)">
    </div>

    <div class="slider-container">
        <h2>Wrist Left-Right
        </h2>
        <input type="range" min="0" max="180" value="90"
            oninput="updateServo(5, this.value)">
    </div>

    <div class="slider-container">
        <h2>Wrist Rotation</h2>
        <input type="range" min="0" max="180" value="90"
            oninput="updateServo(6, this.value)">
    </div>

    <div class="slider-container">
        <h2>[Grab] Hand [Let Go]</h2>
        <input type="range" min="0" max="180" value="90"
            oninput="updateDual(180 - this.value)">
    </div>


    <script>
        const TOKEN = "07zump6GACyF0v1WmtULAvfvTUuDhG8w";

        function updateServo(servo, value) {
            const url = `https://blynk.cloud/external/api/update?token=${TOKEN}&V${servo}=${value}`;
            fetch(url).catch(() => {});
        }

        function updateDual(value) {
            let v1 = Number(value);
            let v2 = 180 - v1;

            fetch(`https://blynk.cloud/external/api/update?token=${TOKEN}&V1=${v1}`)
                .catch(() => {});

            fetch(`https://blynk.cloud/external/api/update?token=${TOKEN}&V2=${v2}`)
                .catch(() => {});

            console.log(`Linked: Servo1=${v1}, Servo2=${v2}`);
        }
    </script>
</body>
</html>
